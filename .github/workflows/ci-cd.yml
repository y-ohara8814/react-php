name: CI/CD to ECR

on:
  push:
    branches:
      - main
      - dev/add_todosystem

jobs:
  build_and_push_ecr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # AWS 認証情報の設定
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      # 正しい ECR ログイン方法
      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region ap-northeast-1 | docker login --username AWS --password-stdin 488556175634.dkr.ecr.ap-northeast-1.amazonaws.com

      # Backendイメージをビルド＆ECRにPush
      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: 488556175634.dkr.ecr.ap-northeast-1.amazonaws.com/my-app-backend:latest

      # Frontendイメージをビルド＆ECRにPush
      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: 488556175634.dkr.ecr.ap-northeast-1.amazonaws.com/my-app-frontend:latest


