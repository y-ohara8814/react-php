name: CI/CD to ECR & Deploy to ECS

on:
  push:
    branches:
      - main
      - dev/add_todosystem

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ap-northeast-1
      ECR_REPO_URI: 488556175634.dkr.ecr.ap-northeast-1.amazonaws.com/my-app-backend
      ECS_CLUSTER: my-app-cluster
      ECS_SERVICE: my-service
      TASK_DEF_FILE: task-definition.json
      CONTAINER_NAME: my-app-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # AWS認証
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ECRログイン
      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region $AWS_REGION \
            | docker login --username AWS --password-stdin $ECR_REPO_URI

      # Reactアプリをビルドし、成果物を backend/public にコピー
      - name: Build React frontend
        run: |
          cd frontend
          npm install
          npm run build
          rm -rf ../backend/public/*
          cp -r dist/* ../backend/public/

      # backendをビルドしてECRにpush
      - name: Build and push backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.ECR_REPO_URI }}:latest

      # 新しいイメージを使ったタスク定義を作成
      - name: Render new ECS task definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.TASK_DEF_FILE }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ env.ECR_REPO_URI }}:latest

      # ECSサービスにデプロイ（タスク定義を反映）
      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          wait-for-service-stability: true
